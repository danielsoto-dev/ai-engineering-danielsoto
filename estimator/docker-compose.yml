# Docker Compose configuration for local development.
# For production, remove the bind mount and the --reload flag.

services:
  estimator:
    build: .
    container_name: estimator
    ports:
      - "8000:8000"

    # Load environment variables (API keys, config) from the local .env file.
    env_file:
      - .env

    # Override REDIS_URL / DATABASE_URL for the in-network services. The .env
    # values (localhost) are meant for running uvicorn outside Docker.
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+asyncpg://estimator:estimator@postgres:5432/estimator

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

    # Bind-mount the app/ directory so code changes are reflected immediately
    # inside the container without rebuilding the image.
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      # Persist the downloaded cross-encoder so recreating the container does
      # not re-download the model on the first reranked search.
      - huggingface_cache:/home/appuser/.cache/huggingface

    # Override the default CMD to enable auto-reload on file changes.
    # Remove --reload for production deployments.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    restart: unless-stopped

    # Health check using Python's stdlib (curl is not available in slim images).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    # Redis Stack bundles RediSearch, which the semantic cache uses for vector
    # similarity queries. Plain redis:7-alpine lacks it and the cache disables.
    image: redis/redis-stack:7.4.0-v0
    container_name: estimator-redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight UI
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    # Postgres 16 with the pgvector extension precompiled and installable via
    # a single CREATE EXTENSION statement.
    image: pgvector/pgvector:pg16
    container_name: estimator-postgres
    environment:
      POSTGRES_DB: estimator
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: estimator
    ports:
      # Host port 5433 to avoid clashing with any locally-running Postgres on
      # the default 5432. Other services reach it over the Docker network at
      # postgres:5432 regardless.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimator -d estimator"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  huggingface_cache:
