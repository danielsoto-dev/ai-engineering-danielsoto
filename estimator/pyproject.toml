[project]
name = "estimator"
version = "0.1.0"
description = "AI-powered software estimation service with typed input and versioned Jinja2 prompts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "litellm>=1.50",
    "instructor>=1.5",
    "redis>=5.0",
    "redisvl>=0.3",
    "streamlit>=1.40",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "tiktoken>=0.7.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "sentence-transformers>=5.7.0",
    # Declared directly so [tool.uv.sources] can route it to the CPU index.
    "torch>=2.13.0",
    "ragas>=0.2.14,<0.3",
    "langchain-community>=0.3,<0.4",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "logfire>=5.0.0",
    "psycopg[binary]>=3.3.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "fakeredis>=2.20",
    "fpdf2>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# On Linux the default torch wheel bundles ~2.5GB of NVIDIA CUDA libraries.
# Containers here run CPU-only, so resolve torch from PyTorch's CPU index
# there. macOS keeps resolving from PyPI, whose build carries no CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
